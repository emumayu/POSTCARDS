alators. Strong on Osaka modernism."},{name:"National Museum of Art, Osaka",genre:"museum",area:"Nakanoshima",tags:["modern","creative","quiet"],note:"Mostly underground. Pair with the museum next door."},{name:"Church of the Light",genre:"architecture",area:"Ibaraki",tags:["architecture","minimal","quiet","hidden"],note:"Tadao Ando. Reservation required, worth the train.",slot:"half day"},{name:"Lilo Coffee Roasters",genre:"cafe",area:"Shinsaibashi",tags:["local","creative","social"],note:"Twenty beans on the board. Ask, they like explaining."},{name:"Mel Coffee Roasters",genre:"cafe",area:"Shinmachi",tags:["minimal","quiet","slow morning"],note:"Standing bar under a house. Two minutes from Utsubo park."},{name:"Takamura Wine & Coffee Roasters",genre:"wine bar",area:"Utsubo",tags:["social","design","lifestyle","warm"],note:"A warehouse of wine, coffee upstairs. Afternoon into evening."},{name:"Le Sucre-Coeur",genre:"bakery",area:"Kishibe",tags:["local","slow morning","hidden"],note:"Out of the way, and worth the detour. Sells out by noon."},{name:"Truck Furniture & Bird Coffee",genre:"shop",area:"Asahi-ku",tags:["design","warm","lifestyle","hidden"],note:"Furniture workshop with a caf\xE9 in the garden. Taxi from Kyobashi."},{name:"graf",genre:"shop",area:"Nakanoshima",tags:["design","creative","minimal"],note:"Studio, shop, and caf\xE9 by the river. Osaka design's living room."},{name:"Nakazakicho walk",genre:"walk",area:"Nakazakicho",tags:["hidden","creative","local","slow"],note:"Old houses turned vintage shops and caf\xE9s. Get lost on purpose."},{name:"Utsubo Park",genre:"walk",area:"Utsubo",tags:["quiet","slow","local"],note:"Roses, tennis, office workers at lunch. Bring the bakery bag."},{name:"Hozenji Yokocho at night",genre:"walk",area:"Namba",tags:["romantic","local","warm"],note:"Stone alley, moss-covered Fudo. Two minutes from the noise."}]},Nagano:{intro:"Mountains on every side. Matsumoto, Karuizawa, and the roads between.",spots:[{name:"Kamikochi Imperial Hotel",genre:"hotel",area:"Kamikochi",tags:["quiet","slow","warm","romantic"],note:"1933 mountain lodge. Open only in the green season.",slot:"full day"},{name:"Hoshinoya Karuizawa",genre:"hotel",area:"Karuizawa",tags:["quiet","minimal","romantic","design"],note:"Water everywhere. Onsen and no reason to leave."},{name:"Matsumoto Hotel Kagetsu",genre:"hotel",area:"Matsumoto",tags:["local","warm","lifestyle","design"],note:"Matsumoto folk-craft furniture in every room. Walkable to everything."},{name:"Hiroshi Senju Museum",genre:"museum",area:"Karuizawa",tags:["architecture","quiet","minimal","slow"],note:"Ryue Nishizawa, one curving floor, trees inside. Rain suits it."},{name:"Chihiro Art Museum Azumino",genre:"museum",area:"Azumino",tags:["warm","quiet","creative","slow"],note:"Picture books and a field of the Alps. Good with children, better without."},{name:"Matsumoto City Museum of Art",genre:"museum",area:"Matsumoto",tags:["modern","creative"],note:"Yayoi Kusama was born here. The tulips outside are hers."},{name:"Kaichi School",genre:"architecture",area:"Matsumoto",tags:["architecture","hidden","quiet"],note:"1876, a Japanese carpenter's idea of a Western school."},{name:"Marumo Coffee",genre:"cafe",area:"Matsumoto Nakamachi",tags:["local","warm","slow morning","hidden"],note:"Kissaten since 1956. Pudding and a river view."},{name:"Sawamura Bakery",genre:"bakery",area:"Karuizawa Harunire Terrace",tags:["slow morning","lifestyle","warm"],note:"Breakfast on the deck by the stream."},{name:"Zenkoji morning service",genre:"walk",area:"Nagano city",tags:["quiet","slow morning","local","romantic"],note:"Be there before dawn. Then the shops open with the light."},{name:"Togakushi cedar approach",genre:"walk",area:"Togakushi",tags:["quiet","slow","nordic"],note:"Two kilometres of 400-year-old cedars. Soba at the end.",slot:"half day"},{name:"Obuse town walk",genre:"walk",area:"Obuse",tags:["local","warm","slow","hidden"],note:"Chestnut town where Hokusai spent his last years. Open gardens."},{name:"Nakamachi Street kura",genre:"walk",area:"Matsumoto",tags:["design","local","lifestyle"],note:"White storehouses, folk-craft shops, one good soba."}]},Yamanashi:{intro:"Fuji on one side, vineyards on the other. Rent a car, drive slowly.",spots:[{name:"Hoshinoya Fuji",genre:"hotel",area:"Kawaguchiko",tags:["quiet","minimal","romantic","nordic"],note:"Cabins in a forest facing the lake. Fires at night."},{name:"Risonare Yatsugatake",genre:"hotel",area:"Kobuchizawa",tags:["design","social","lifestyle"],note:"Mario Bella's arcade in the woods. Easy base for the wineries."},{name:"Kiyoharu Art Village",genre:"museum",area:"Hokuto",tags:["architecture","quiet","creative","hidden"],note:"Tadao Ando's chapel, a Yoshio Taniguchi museum, cherry trees. Nearly empty."},{name:"Nakamura Keith Haring Collection",genre:"museum",area:"Kobuchizawa",tags:["modern","creative","architecture"],note:"A dark building in a light forest. Odd and worth it."},{name:"Kubota Itchiku Art Museum",genre:"museum",area:"Kawaguchiko",tags:["quiet","hidden","creative","slow"],note:"Kimono as landscapes, in a Gaud\xED-like garden."},{name:"Grace Wine",genre:"wine bar",area:"Katsunuma",tags:["local","lifestyle","slow","warm"],note:"Koshu, the grape Yamanashi is known for. Tasting room by the vines."},{name:"Ch\xE2teau Mercian Katsunuma",genre:"wine bar",area:"Katsunuma",tags:["local","design","social"],note:"Old winery buildings, a small museum, lunch on the terrace."},{name:"Kosaku Hoto",genre:"restaurant",area:"Kofu",tags:["local","warm"],note:"Flat noodles in miso and pumpkin. What the mountains eat."},{name:"Oshino Hakkai at opening",genre:"walk",area:"Oshino",tags:["quiet","slow morning","hidden"],note:"Eight spring ponds. Before 8am it's a village; after, a bus stop."},{name:"Kawaguchiko north shore",genre:"walk",area:"Kawaguchiko",tags:["quiet","slow","romantic"],note:"Fuji across the water, best in the hour after sunrise."},{name:"Fujiyoshida Honcho street",genre:"walk",area:"Fujiyoshida",tags:["local","creative","hidden","lifestyle"],note:"Old textile town, Fuji filling the end of the street. Sunday afternoon."},{name:"Kiyosato highlands drive",genre:"walk",area:"Kiyosato",tags:["nordic","slow","quiet"],note:"Larch forests, cows, soft-serve. Feels like somewhere else."}]},Kamakura:{intro:"An hour from Tokyo, a century away. Sea on one side, hills on the other.",spots:[{name:"Kamakura Kokon",genre:"hotel",area:"Yuigahama",tags:["quiet","warm","local","hidden"],note:"Two rooms in a 1920s house. Breakfast is the reason."},{name:"WeBase Kamakura",genre:"hotel",area:"Yuigahama",tags:["social","lifestyle","minimal"],note:"Beach hostel with a yoga floor. Cheap and clean."},{name:"Kamakura Museum of Literature",genre:"museum",area:"Hase",tags:["architecture","quiet","romantic","hidden"],note:"A 1936 villa above a rose garden. Kawabata's Kamakura."},{name:"Hokokuji",genre:"walk",area:"Jomyoji",tags:["quiet","slow","minimal"],note:"Bamboo garden, matcha at the back. Arrive at opening."},{name:"Meigetsuin",genre:"walk",area:"Kita-Kamakura",tags:["quiet","slow morning","romantic"],note:"The round window. Hydrangeas in June, empty in February."},{name:"Caf\xE9 Vivement Dimanche",genre:"cafe",area:"Komachi",tags:["warm","local","slow morning","lifestyle"],note:"Kamakura's coffee living room since 1994. Brazilian records."},{name:"Kamakura Bergfeld",genre:"bakery",area:"Nikaido",tags:["local","slow morning","warm"],note:"German rye and pretzels. Take them to the shrine steps."},{name:"Paradise Alley Bread & Co",genre:"bakery",area:"Komachi market",tags:["creative","hidden","local"],note:"Sourdough from a market stall covered in paint."},{name:"Matsubara-an",genre:"restaurant",area:"Yuigahama",tags:["quiet","warm","romantic","local"],note:"Soba in an old house with a garden. Sake first."},{name:"Moyai Kougei",genre:"shop",area:"Sasuke",tags:["design","local","lifestyle","warm"],note:"Folk craft from all over Japan, in a house on a quiet lane."},{name:"Inamuragasaki at sunset",genre:"walk",area:"Inamuragasaki",tags:["romantic","slow","quiet"],note:"Enoshima and Fuji in one frame. Then onsen next door."},{name:"Enoden to Enoshima",genre:"walk",area:"Enoden line",tags:["slow","local","romantic"],note:"Sit on the sea side. Get off wherever looks right."},{name:"Daibutsu hiking trail",genre:"walk",area:"Kita-Kamakura to Hase",tags:["quiet","nordic","slow"],note:"Ninety minutes through the hills. Ends at the Buddha.",slot:"half day"}]}},mp=`
  .pc, .pc *, .pc *::before, .pc *::after { box-sizing:border-box; }
  .pc { --paper:#f1f1ee; --ink:#1c1b19; --mute:#7a7973; --line:#c8c7c0; --moss:#7e7854; --card:#fbfbf9;
        min-height:100vh; background:var(--paper); color:var(--ink); font-family:Helvetica Neue, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing:antialiased; }
  .pc .serif { font-family:'Futura','Futura PT','Poppins', Helvetica Neue, Helvetica, Arial, sans-serif; font-weight:700; letter-spacing:-0.01em; }
  .pc .topfont { font-family:'Futura','Futura PT','Poppins', Helvetica Neue, Helvetica, Arial, sans-serif; letter-spacing:0; }
  .pc .stepline { font-family:'Futura','Futura PT','Poppins', Helvetica Neue, Helvetica, Arial, sans-serif; font-weight:700; font-size:22px; color:var(--ink); margin:0 0 6px; }
  .pc .wrap { max-width:1140px; margin:0 auto; padding:40px 56px 100px; }
  .pc .menubtn { position:fixed; top:28px; right:24px; z-index:60; width:32px; height:24px; background:none; border:none; cursor:pointer; padding:0; display:flex; flex-direction:column; justify-content:space-between; }
  .pc .menubtn span { display:block; width:100%; height:2px; background:var(--ink); }
  .pc .menuoverlay { position:fixed; inset:0; background:var(--paper); z-index:70; padding:40px 24px; overflow-y:auto; }
  .pc .menuclose { position:fixed; top:24px; right:24px; z-index:80; background:none; border:none; font-size:32px; line-height:1; color:var(--ink); cursor:pointer; }
  .pc .menulist { display:flex; flex-direction:column; gap:22px; margin-top:60px; }
  .pc .menuitem { text-align:left; background:none; border:none; font-family:inherit; font-size:22px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink); cursor:pointer; padding:0; }
  .pc .pageoverlay { position:fixed; inset:0; background:var(--paper); z-index:70; padding:80px 24px 40px; overflow-y:auto; max-width:680px; margin:0 auto; }
  .pc .brand span:first-child { font-weight:700; }
  .pc .brand { font-family:Helvetica Neue, Helvetica, Arial, sans-serif; font-size:13px; letter-spacing:0.28em; display:flex; justify-content:space-between; align-items:baseline; padding-right:52px; }
  .pc .brand span:last-child { letter-spacing:0;  color:var(--mute); font-size:12px; }
  .pc .brand span:first-child { font-weight:700; letter-spacing:0.02em; font-size:16px; }
  .pc h1 { font-size:clamp(34px,6vw,52px); line-height:1.05; margin:64px 0 16px; }
  .pc .herophoto { margin-top:20px; aspect-ratio:4/3; background:var(--card); border-radius:0; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; width:100vw; margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw); }
  .pc .herophoto img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .pc .midphoto { margin-top:24px; aspect-ratio:4/3; overflow:hidden; border-radius:0; width:100vw; margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw); }
  .pc .midphoto img { width:100%; height:100%; object-fit:cover; display:block; }
  .pc .splitrow { display:flex; flex-wrap:wrap; gap:0; align-items:stretch; margin-top:0; }
  .pc .splitrow.rev { flex-direction:row-reverse; }
  .pc .splitrow .stext { flex:1 1 260px; position:static; background:var(--moss); color:#f5f2e6; padding:56px 48px; display:flex; flex-direction:column; justify-content:center; }
  .pc .splitrow .stext h2 { color:#f5f2e6; }
  .pc .splitrow .stext p.lead { color:#ddd7c4; }
  .pc .splitrow .stext p.lead b { color:#f5f2e6; }
  .pc .splitrow .simg { flex:1.15 1 300px; aspect-ratio:4/5; overflow:hidden; border-radius:0; align-self:stretch; }
  @media (max-width:640px) { .pc .splitrow .simg { aspect-ratio:1/1; } }
  .pc .splitrow .simg img { width:100%; height:100%; object-fit:cover; display:block; }
  @media (max-width:640px) { .pc .splitrow .stext { padding:36px 24px; } }
  .pc .herophoto::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.02) 35%,rgba(0,0,0,.4)); pointer-events:none; }
  .pc .herophoto .phold { color:var(--mute); font-size:13px; letter-spacing:0.02em; position:relative; z-index:1; }
  .pc .herophoto .herosub { position:absolute; left:20px; top:14%; bottom:10%; display:flex; flex-direction:column; justify-content:space-between; z-index:1; }
  .pc .herophoto .herosub b { font-family:'Futura','Futura PT','Poppins', Helvetica Neue, Helvetica, Arial, sans-serif; font-size:clamp(28px,8vw,46px); font-weight:700; color:#fff; text-shadow:0 2px 14px rgba(0,0,0,.4); line-height:1.05; text-transform:none; }
  .pc .herophoto ~ h1 { margin-top:28px; }
  @media (min-width:860px) {
    .pc .herophoto { aspect-ratio:1.97/1; }
    .pc .herophoto .herosub { left:56px; right:56px; top:12%; bottom:10%; }
    .pc .herophoto .herosub b { font-size:60px; }
  }
  @media (max-width:640px) { .pc .langtoggle { display:none; } }
  .pc .herocta { margin-top:30px; }
  .pc .herocta .why { margin-top:8px; }
  .pc h2 { font-size:clamp(28px,4.5vw,36px); line-height:1.1; margin:48px 0 8px; }
  .pc p { line-height:1.6; }
  .pc .lead { color:var(--mute); max-width:44ch; }
  .pc .stepicon { width:100%; height:100%; object-fit:contain; display:block; }
  .pc .twocol { display:flex; align-items:flex-start; gap:28px; }
  .pc .twocol .stepcol-text { flex:1 1 auto; min-width:0; }
  .pc .twocol .stepcol-icon { width:120px; height:120px; flex-shrink:0; }
  .pc .twocol h1, .pc .twocol h2 { margin-top:0; }
  @media (max-width:520px) { .pc .twocol { gap:16px; } .pc .twocol .stepcol-icon { width:84px; height:84px; } }
  .pc .item .time { display:flex; align-items:center; gap:5px; }
  .pc .item .time img { width:12px; height:12px; opacity:.55; display:block; }
  .pc .stack { display:flex; flex-direction:column; gap:10px; margin-top:28px; }
  .pc .opt { text-align:left; background:transparent; border:1px solid var(--line); padding:18px 20px; border-radius:2px;
             font:inherit; color:var(--ink); cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .pc .opt:hover { border-color:var(--ink); }
  .pc .opt.on { border-color:var(--ink); background:var(--ink); color:var(--paper); }
  .pc .opt:disabled { color:var(--mute); cursor:default; }
  .pc .opt:disabled:hover { border-color:var(--line); }
  .pc .opt small { color:var(--mute); font-size:13px; }
  .pc .opt:focus-visible, .pc .tag:focus-visible, .pc .btn:focus-visible, .pc input:focus-visible { outline:2px solid var(--moss); outline-offset:2px; }
  .pc .tags { display:flex; flex-wrap:wrap; gap:8px; margin-top:28px; }
  .pc .tag { font:inherit; font-size:14px; padding:9px 14px; border:1px solid var(--line); border-radius:999px; background:transparent; color:var(--ink); cursor:pointer; }
  .pc .tag.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .pc .row { display:flex; gap:12px; margin-top:36px; align-items:center; }
  .pc .btn { font:inherit; font-size:15px; padding:14px 22px; background:#45412f; color:var(--paper); border:0; border-radius:2px; cursor:pointer; }
  .pc .btn:disabled { background:var(--line); cursor:default; }
  .pc .ghost { background:transparent; color:var(--mute); border:0; font:inherit; cursor:pointer; padding:14px 0; }
  .pc input { font:inherit; font-size:24px; font-family:Helvetica Neue, Helvetica, Arial, sans-serif; font-weight:300; background:transparent; border:0; border-bottom:1px solid var(--ink); padding:8px 0; width:100%; color:var(--ink); }
  .pc .cur { color:var(--mute); font-size:13px; margin-top:8px; }
  .pc .field { margin-top:28px; }
  .pc .field + .field { margin-top:36px; }
  .pc .days { display:flex; flex-direction:column; gap:40px; margin-top:40px; }
  .pc .day { display:grid; grid-template-columns:1fr; gap:6px; }
  .pc .dayhead { display:flex; align-items:baseline; gap:12px; margin-bottom:4px; }
  .pc .dayhead .n { font-family:Helvetica Neue, Helvetica, Arial, sans-serif; font-size:14px; color:var(--mute); }
  .pc .dayhead .t { font-family:Helvetica Neue, Helvetica, Arial, sans-serif; font-weight:300; font-size:26px; }
  .pc .item { display:grid; grid-template-columns:64px 1fr; gap:14px; padding:12px 0; border-top:1px solid var(--line); }
  .pc .item .time { color:var(--mute); font-size:13px; padding-top:3px; font-variant-numeric:tabular-nums; }
  .pc .item .name { font-size:16px; }
  .pc .item .why { color:var(--mute); font-size:14px; margin-top:3px; line-height:1.5; }
  .pc .item.spot { grid-template-columns:64px 1fr; }
  .pc .photo { width:100%; aspect-ratio:4/3; background:var(--line); border-radius:2px; overflow:hidden; margin:8px 0 6px; }
  .pc .photo img { width:100%; height:100%; object-fit:cover; display:block; }
  .pc .photo.empty { background:repeating-linear-gradient(45deg, var(--line) 0 1px, transparent 1px 10px); }
  .pc .go { display:flex; gap:16px; margin-top:8px; }
  .pc .go a { color:var(--mute); font-size:12px; text-decoration:underline; text-underline-offset:3px; }
  .pc .go a:hover { color:var(--ink); }
  .pc .book { margin-top:48px; }
  .pc .book h3 { font-size:13px; letter-spacing:0.18em; text-transform:uppercase; color:var(--mute); font-weight:400; margin:28px 0 10px; }
  .pc .item.rest .name { font-weight:300; color:var(--moss); font-size:18px; }
  .pc .note { margin-top:48px; }
  .pc .note p { margin:0 0 14px; font-family:Helvetica Neue, Helvetica, Arial, sans-serif; font-weight:300; font-size:18px; max-width:40ch; }
  .pc .links { display:flex; flex-wrap:wrap; gap:8px 20px; }
  .pc .links a { color:var(--ink); font-size:14px; text-decoration:underline; text-underline-offset:4px; }
  .pc .loading { margin-top:80px; }
  .pc .loading .serif { font-size:28px; }
  .pc .bar { height:1px; background:var(--line); margin-top:24px; overflow:hidden; }
  .pc .bar i { display:block; height:100%; width:30%; background:var(--ink); animation:slide 1.6s ease-in-out infinite; }
  @keyframes slide { 0%{transform:translateX(-100%)} 100%{transform:translateX(340%)} }
  @media (prefers-reduced-motion: reduce) { .pc .bar i { animation:none; width:100%; } }
  .pc .lists { display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
  .pc .lists button { font:inherit; font-size:13px; padding:8px 12px; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:2px; cursor:pointer; }
  .pc .lists button.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .pc .listitem { padding:16px 0; border-top:1px solid var(--line); }
  .pc .listitem .area { color:var(--mute); font-size:13px; }
  .pc .map { width:100%; margin-top:12px; }
  .pc .map svg { border:1px solid var(--line); border-radius:2px; background:var(--line); }
  .pc .legend { list-style:none; counter-reset:pin; padding:0; margin:10px 0 0; display:flex; flex-direction:column; gap:10px; font-size:12px; }
  .pc .legend li { counter-increment:pin; position:relative; padding-left:24px; line-height:1.5; }
  .pc .legend li::before { content:counter(pin); position:absolute; left:0; top:1px; width:14px; height:14px; border-radius:50%; background:var(--ink); color:var(--paper); font-size:8px; display:inline-flex; align-items:center; justify-content:center; }
  .pc .legend li span { display:block; color:var(--mute); text-transform:uppercase; letter-spacing:0.02em; margin-top:2px; }
  .pc .switch { display:flex; gap:14px; margin-top:20px; }
  .pc .switch button { font:inherit; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; background:transparent; border:0; padding:0 0 4px; color:var(--mute); cursor:pointer; border-bottom:1px solid transparent; }
  .pc .switch button.on { color:var(--ink); border-bottom-color:var(--ink); }
  .pc .listitem { padding:24px 0; border-top:1px solid var(--line); display:grid; grid-template-columns:1fr; gap:6px; }
  .pc .listitem .top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .pc .listitem .name { font-size:18px; }
  .pc .listitem .price { color:var(--mute); font-size:13px; white-space:nowrap; }
  .pc .facts { margin-top:8px; display:grid; grid-template-columns:72px 1fr; gap:4px 12px; font-size:13px; }
  .pc .facts dt { color:var(--mute); }
  .pc .facts dd { margin:0; line-height:1.5; }
  .pc .err { color:#8a3b2f; margin-top:20px; font-size:14px; }
